openapi: 3.1.0
info:
  title: agent-identity
  version: 0.1.0
  description: |
    Language-agnostic credential resolution API for AI agents.
    Any application — Python, Go, Ruby, Java — can POST to these two endpoints
    over HTTP to resolve credentials without TypeScript knowledge.
    Deploy as a sidecar: `docker run -p 3001:3001 datacules/agent-identity`
  contact:
    name: Datacules LLC
    url: https://github.com/hvrcharon1/agent-identity
  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local sidecar (Docker)
  - url: http://localhost:3000
    description: Local Next.js dev server

tags:
  - name: resolve
    description: Credential resolution for standard agent requests
  - name: migrate
    description: Dual-credential resolution for data migration workflows

paths:
  /api/resolve:
    post:
      operationId: resolveCredential
      tags: [resolve]
      summary: Resolve a credential for an agent request
      description: |
        Accepts an AgentRequestContext and returns a resolved credential reference.
        The raw secret is **never** returned — only the identity that was resolved
        and an optional expiry time the caller can use to schedule re-resolution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequestContext'
            examples:
              anthropic_shared:
                summary: Anthropic shared resource read
                value:
                  userId: user-abc
                  resourceId: knowledge-base
                  resourceKind: shared
                  provider: anthropic
                  model: claude-sonnet-4-20250514
                  action: read
                  traceId: trace-xyz-001
                  requestedAt: '2026-01-01T00:00:00Z'
              openai_personal:
                summary: OpenAI personal resource write
                value:
                  userId: user-xyz
                  resourceId: user-notes
                  resourceKind: personal
                  provider: openai
                  model: gpt-4o
                  action: write
                  traceId: trace-xyz-002
                  sessionId: session-abc
                  requestedAt: '2026-01-01T00:00:00Z'
      responses:
        '200':
          description: Credential resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
              example:
                ok: true
                resolvedFor: user-abc
                expiresAt: '2026-01-01T01:00:00Z'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: No credential matched the context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No credential resolved for this context
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/migrate/resolve:
    post:
      operationId: resolveMigrationCredentials
      tags: [migrate]
      summary: Resolve source + target credentials for a migration phase
      description: |
        Resolves both credentials for a data migration in a single round-trip.
        Returns the resolved identity for the source (read) and target (write)
        credentials, plus the earliest expiry of the pair so the agent knows
        when to re-resolve before the batch loop ends.
        Phase semantics:
          - `dry-run`   → read-only on both source and target
          - `extract`   → read on source
          - `transform` → read on source
          - `load`      → write on target
          - `verify`    → read on both
          - `rollback`  → write on target (undo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateResolveRequest'
            examples:
              dry_run:
                summary: Dry-run preflight check
                value:
                  migrationId: migration-2026-q2
                  phase: dry-run
                  sourceResourceId: crm-postgres-prod
                  targetResourceId: crm-postgres-v2
                  userId: svc-migration-bot
                  provider: anthropic
                  model: claude-sonnet-4-20250514
                  traceId: trace-abc123
                  dryRun: true
              load_phase:
                summary: Load phase (writes data to target)
                value:
                  migrationId: migration-2026-q2
                  phase: load
                  sourceResourceId: crm-postgres-prod
                  targetResourceId: crm-postgres-v2
                  userId: svc-migration-bot
                  provider: anthropic
                  model: claude-sonnet-4-20250514
                  traceId: trace-abc124
                  dryRun: false
                  batchIndex: 0
                  totalBatches: 42
      responses:
        '200':
          description: Both credentials resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrateResolveResponse'
              example:
                migrationId: migration-2026-q2
                phase: load
                sourceResolvedFor: service
                targetResolvedFor: service
                dryRun: false
                expiresAt: '2026-01-01T02:00:00Z'
        '400':
          description: Invalid request body or unknown phase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: No matching credential rule found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:

    SupportedProvider:
      type: string
      enum: [openai, anthropic, gemini, mistral, local]
      description: AI provider identifier

    ResourceKind:
      type: string
      enum: [shared, personal]
      description: Whether the resource is shared across users or personal to the requesting user

    MigrationPhase:
      type: string
      enum: [dry-run, extract, transform, load, verify, rollback]
      description: |
        Ordered phases of a data migration run.
        dry-run → extract → transform → load → verify; rollback on failure.

    AgentRequestContext:
      type: object
      required:
        - userId
        - resourceId
        - resourceKind
        - provider
        - model
        - action
        - traceId
        - requestedAt
      properties:
        userId:
          type: string
          minLength: 1
          description: Identifier of the user or service account making the request
          example: user-abc
        resourceId:
          type: string
          minLength: 1
          description: Identifier of the resource being accessed
          example: knowledge-base
        resourceKind:
          $ref: '#/components/schemas/ResourceKind'
        provider:
          $ref: '#/components/schemas/SupportedProvider'
        model:
          type: string
          minLength: 1
          description: Model name as used by the provider's API
          example: claude-sonnet-4-20250514
        action:
          type: string
          minLength: 1
          description: The operation being performed (read, write, delete, etc.)
          example: read
        traceId:
          type: string
          minLength: 1
          description: Distributed trace ID — propagated across all steps of a multi-step agent run
          example: trace-xyz-001
        sessionId:
          type: string
          description: Optional — groups related requests for the same user session
          example: session-abc
        requestedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the request was initiated
          example: '2026-01-01T00:00:00Z'
        parentTraceId:
          type: string
          description: Optional — for nested agent calls (agent calling another agent)
          example: trace-parent-000

    MigrateResolveRequest:
      type: object
      required:
        - migrationId
        - phase
        - sourceResourceId
        - targetResourceId
        - userId
        - provider
        - model
        - traceId
      properties:
        migrationId:
          type: string
          minLength: 1
          description: Ties all phases of one migration run together across audit entries
          example: migration-2026-q2
        phase:
          $ref: '#/components/schemas/MigrationPhase'
        sourceResourceId:
          type: string
          minLength: 1
          description: Resource data is read FROM
          example: crm-postgres-prod
        targetResourceId:
          type: string
          minLength: 1
          description: Resource data is written TO
          example: crm-postgres-v2
        userId:
          type: string
          minLength: 1
          example: svc-migration-bot
        provider:
          $ref: '#/components/schemas/SupportedProvider'
        model:
          type: string
          minLength: 1
          example: claude-sonnet-4-20250514
        traceId:
          type: string
          minLength: 1
          example: trace-abc123
        dryRun:
          type: boolean
          default: false
          description: When true, enforces read-only credential resolution on both sides
        batchIndex:
          type: integer
          minimum: 0
          description: Current batch number (0-indexed) for paginated large-dataset migrations
        totalBatches:
          type: integer
          minimum: 1
          description: Total number of batches in this migration run

    ResolveResponse:
      type: object
      required: [ok, resolvedFor]
      properties:
        ok:
          type: boolean
          example: true
        resolvedFor:
          type: string
          description: |
            The identity the credential was resolved for.
            'service' for fixed credentials; userId for user-delegated credentials.
          example: user-abc
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO 8601 expiry time of the resolved credential.
            Absent if the credential does not expire.
            Clients should re-resolve before this time to avoid auth failures.
          example: '2026-01-01T01:00:00Z'

    MigrateResolveResponse:
      type: object
      required: [migrationId, phase, sourceResolvedFor, targetResolvedFor, dryRun]
      properties:
        migrationId:
          type: string
          example: migration-2026-q2
        phase:
          $ref: '#/components/schemas/MigrationPhase'
        sourceResolvedFor:
          type: string
          description: Identity resolved for the source (read) credential
          example: service
        targetResolvedFor:
          type: string
          description: Identity resolved for the target (write) credential
          example: service
        dryRun:
          type: boolean
          example: false
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Earliest expiry of the source and target credentials. Absent if neither expires.
          example: '2026-01-01T02:00:00Z'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: No credential resolved for this context

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Zod flatten() output — structured field-level errors
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
          example:
            formErrors: []
            fieldErrors:
              provider: ["Invalid enum value. Expected 'openai' | 'anthropic' | 'gemini' | 'mistral' | 'local'"]
              requestedAt: ["Invalid datetime"]
