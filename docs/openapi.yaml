openapi: 3.1.0
info:
  title: Agent Identity API
  version: 0.11.1
  description: Provider-agnostic credential routing and identity management for AI agents
  license:
    name: SEE LICENSE IN LICENSE
servers:
  - url: http://localhost:3000
    description: Local development
components:
  schemas:
    SupportedProvider:
      type: string
      enum: &a2
        - openai
        - anthropic
        - gemini
        - mistral
        - local
      description: AI provider identifier
    ResourceKind:
      type: string
      enum: &a1
        - shared
        - personal
      description: Resource access scope
    MigrationPhase:
      type: string
      enum: &a3
        - dry-run
        - extract
        - transform
        - load
        - verify
        - rollback
      description: Migration lifecycle phase
    AgentRequestContext:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
        resourceKind:
          type: string
          enum: *a1
        provider:
          type: string
          enum: *a2
        model:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        sessionId:
          type: string
        requestedAt:
          type: string
          format: date-time
        parentTraceId:
          type: string
        spiffeId:
          type: string
      required:
        - userId
        - resourceId
        - resourceKind
        - provider
        - model
        - action
        - traceId
        - requestedAt
      description: Context for credential resolution
    MigrateResolveRequest:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
        resourceKind:
          type: string
          enum: *a1
        provider:
          type: string
          enum: *a2
        model:
          type: string
          minLength: 1
        action:
          type: string
          minLength: 1
        traceId:
          type: string
          minLength: 1
        sessionId:
          type: string
        requestedAt:
          type: string
          format: date-time
        parentTraceId:
          type: string
        spiffeId:
          type: string
        migrationId:
          type: string
          minLength: 1
        phase:
          type: string
          enum: *a3
        sourceResourceId:
          type: string
          minLength: 1
        targetResourceId:
          type: string
          minLength: 1
        dryRun:
          type: boolean
        batchIndex:
          type: integer
          minimum: 0
        totalBatches:
          type: integer
          exclusiveMinimum: 0
      required:
        - userId
        - resourceId
        - resourceKind
        - provider
        - model
        - action
        - traceId
        - requestedAt
        - migrationId
        - phase
        - sourceResourceId
        - targetResourceId
        - dryRun
      description: Migration credential resolution request
    ResolveResponse:
      type: object
      properties:
        ok:
          type: boolean
        credentialId:
          type: string
        resolvedFor:
          type: string
        expiresAt:
          type: string
      required:
        - ok
        - credentialId
        - resolvedFor
      description: Successful credential resolution response
    MigrateResolveResponse:
      type: object
      properties:
        migrationId:
          type: string
        phase:
          type: string
          enum: *a3
        sourceCredentialId:
          type: string
        sourceResolvedFor:
          type: string
        targetCredentialId:
          type: string
        targetResolvedFor:
          type: string
        dryRun:
          type: boolean
        expiresAt:
          type: string
      required:
        - migrationId
        - phase
        - sourceCredentialId
        - sourceResolvedFor
        - targetCredentialId
        - targetResolvedFor
        - dryRun
      description: Migration credential pair resolution response
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
        timestamp:
          type: string
        credentialsLoaded:
          type: number
        rulesLoaded:
          type: number
      required:
        - status
        - version
        - timestamp
        - credentialsLoaded
        - rulesLoaded
      description: Server health check response
    ApproveRequest:
      type: object
      properties:
        requestId:
          type: string
        action:
          type: string
          enum:
            - approve
            - reject
        resolvedBy:
          type: string
        justification:
          type: string
      required:
        - requestId
        - action
      description: Approve or reject a pending request
    ApproveResponse:
      type: object
      properties:
        ok:
          type: boolean
        request:
          type: object
          properties:
            requestId:
              type: string
            status:
              type: string
            resolvedAt:
              type: string
            resolvedBy:
              type: string
          required:
            - requestId
            - status
      required:
        - ok
        - request
      description: Approval action response
    BreakGlassRequest:
      type: object
      properties:
        requestId:
          type: string
        operator:
          type: string
          minLength: 1
        justification:
          type: string
          minLength: 10
      required:
        - requestId
        - operator
        - justification
      description: Emergency break-glass override request
    BreakGlassResponse:
      type: object
      properties:
        ok:
          type: boolean
        warning:
          type: string
        request:
          type: object
          properties:
            requestId:
              type: string
            status:
              type: string
              enum:
                - break_glass
          required:
            - requestId
            - status
      required:
        - ok
        - request
      description: Break-glass override response
    BudgetResponse:
      type: object
      properties:
        credentials:
          type: array
          items:
            type: object
            properties:
              credentialId:
                type: string
              name:
                type: string
              usage:
                type: object
                properties:
                  hourlyCount:
                    type: number
                  sessions:
                    type: number
                  dailySpend:
                    type: number
                required:
                  - hourlyCount
                  - sessions
                  - dailySpend
            required:
              - credentialId
              - name
              - usage
      required:
        - credentials
      description: Budget utilisation for all credentials
    BudgetResetRequest:
      type: object
      properties:
        credentialId:
          type: string
        counter:
          type: string
          enum:
            - hourly
            - daily
      required:
        - credentialId
        - counter
      description: Reset a budget counter
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
      description: Generic success response
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      description: Error response
    AnomalyObserveResponse:
      type: object
      properties:
        ok:
          type: boolean
        observed:
          type: string
        anomalies:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              severity:
                type: string
              message:
                type: string
            required:
              - type
              - severity
              - message
        blocked:
          type: boolean
      required:
        - ok
        - observed
        - anomalies
        - blocked
      description: Anomaly detection observation result
    AttestSignResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
      description: Signed attestation token
    AttestVerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
        expired:
          type: boolean
        payload:
          type: object
          properties: {}
        remainingSeconds:
          type: number
        error:
          type: string
      required:
        - valid
      description: Attestation verification result
    FederationIssueResponse:
      type: object
      properties:
        ok:
          type: boolean
        chain:
          type: array
          items:
            type: object
            properties:
              trustDomain:
                type: string
              userId:
                type: string
              action:
                type: string
              timestamp:
                type: string
              signature:
                type: string
            required:
              - trustDomain
              - userId
              - action
              - timestamp
              - signature
        trustDomain:
          type: string
      required:
        - ok
        - chain
        - trustDomain
      description: Federation chain issue response
    FederationVerifyResponse:
      type: object
      properties:
        ok:
          type: boolean
        chain:
          type: array
          items:
            type: object
            properties: {}
        entriesVerified:
          type: number
        trustedDomains:
          type: array
          items:
            type: string
      required:
        - ok
        - entriesVerified
        - trustedDomains
      description: Federation chain verification response
  parameters: {}
paths:
  /api/health:
    get:
      summary: Health check
      description: Liveness probe for the agent-identity server
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/resolve:
    post:
      summary: Resolve credential
      description: Server-side credential resolution using the configured store and routing rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequestContext"
      responses:
        "200":
          description: Credential resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No credential matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/migrate/resolve:
    post:
      summary: Resolve migration credential pair
      description: Resolves separate source and target credentials for a migration context
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateResolveRequest"
      responses:
        "200":
          description: Credential pair resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrateResolveResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No credential matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/approve:
    post:
      summary: Approve or reject a pending request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/approve/break-glass:
    post:
      summary: Emergency break-glass override
      description: Bypasses approval flow. Logged as a non-deletable audit entry.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakGlassRequest"
      responses:
        "200":
          description: Override applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassResponse"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/budget:
    get:
      summary: Get budget utilisation
      description: Returns per-credential hourly count, concurrent sessions, and daily spend
      responses:
        "200":
          description: Budget data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
    post:
      summary: Reset budget counter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetResetRequest"
      responses:
        "200":
          description: Counter reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/anomaly:
    post:
      summary: Observe agent request for anomalies
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRequestContext"
      responses:
        "200":
          description: Observation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyObserveResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Reset anomaly baseline
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Baseline reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/attest/sign:
    post:
      summary: Sign attestation token
      description: Creates a signed JWT attestation token for a credential resolution
      responses:
        "200":
          description: Token signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestSignResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/attest:
    post:
      summary: Verify attestation token
      description: Verifies a signed JWT attestation token
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestVerifyResponse"
  /api/federation/issue:
    post:
      summary: Issue identity chain
      description: Creates or extends a cross-domain identity chain
      responses:
        "200":
          description: Chain issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationIssueResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/federation/verify:
    post:
      summary: Verify identity chain
      description: Verifies all entries in a cross-domain identity chain
      responses:
        "200":
          description: Chain verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationVerifyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
webhooks: {}
