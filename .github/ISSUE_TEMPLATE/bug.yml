name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages and stack traces if available.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - router (src/lib/router.ts)
        - decision helper (src/lib/decision.ts)
        - providers / adapters (src/lib/providers.ts)
        - credentials (src/lib/credentials.ts)
        - types (src/lib/types.ts)
        - API route (src/app/api/resolve)
        - hooks (src/hooks)
        - UI components (src/components)
        - CI / build
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Affected AI provider (if relevant)
      options:
        - Not applicable
        - OpenAI
        - Anthropic
        - Gemini
        - Mistral
        - Local / self-hosted
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of agent-identity are you using? (check package.json)
      placeholder: e.g. 0.1.0
    validations:
      required: false
