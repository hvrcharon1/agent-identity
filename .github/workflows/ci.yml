name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 0. Build publishable packages ────────────────────────────────────────────
  build-packages:
    name: Build workspace packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Show installed TypeScript version
        run: |
          echo "=== root tsc ==="
          ./node_modules/.bin/tsc --version 2>/dev/null || echo "no root tsc"
          echo "=== packages/core tsc ==="
          ./packages/core/node_modules/.bin/tsc --version 2>/dev/null || echo "no core tsc"
          echo "=== packages/core package.json ==="
          cat packages/core/package.json

      - name: Build @datacules/agent-identity (core) - ESM
        run: |
          cd packages/core
          echo "--- tsconfig.build.json ---"
          cat tsconfig.build.json
          echo "--- tsc -p tsconfig.build.json ---"
          npx tsc -p tsconfig.build.json 2>&1
          echo "ESM build exit: $?"

      - name: Build @datacules/agent-identity (core) - CJS
        run: |
          cd packages/core
          echo "--- tsconfig.cjs.json ---"
          cat tsconfig.cjs.json
          echo "--- tsc -p tsconfig.cjs.json ---"
          npx tsc -p tsconfig.cjs.json 2>&1
          echo "CJS build exit: $?"

      - name: Build all workspace packages
        run: |
          for pkg in \
            packages/audit \
            packages/stores/aws \
            packages/stores/vault \
            packages/stores/azure \
            packages/stores/authmd \
            packages/stores/libsql \
            packages/stores/dynamic \
            packages/stores/spiffe \
            packages/integrations/express \
            packages/integrations/fastify \
            packages/integrations/langchain \
            packages/integrations/nestjs \
            packages/integrations/otel \
            packages/integrations/anomaly \
            packages/integrations/compliance \
            packages/integrations/mcp \
            packages/integrations/mcp-client \
            packages/integrations/token-exchange \
            packages/cli; do
            echo "=== Building $pkg ==="
            npm run build --workspace="$pkg"
          done

      - name: Upload packages/core/dist
        uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
          retention-days: 1

  # ─── 1. Type-check ─────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    needs: [build-packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - run: npm run type-check

  # ─── 2. Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: [build-packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - run: npm run lint

  # ─── 3. Node.js unit tests (Linux) ─────────────────────────────────────────────
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm test

  # ─── 3a. Node.js unit tests (Windows) ──────────────────────────────────────────
  test-windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: npm install --legacy-peer-deps

      - name: Run unit tests
        shell: bash
        run: npm test

  # ─── 4. Python SDK tests ───────────────────────────────────────────────────────
  test-python:
    name: Unit tests (Python SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK in editable mode with dev deps
        working-directory: packages/python-sdk
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: packages/python-sdk
        run: |
          pytest tests/ -v --tb=short --cov=agent_identity --cov-report=term-missing

  # ─── 5. Build + Smoke test (Linux) ────────────────────────────────────────────
  build-and-smoke:
    name: Build + smoke test (Linux)
    runs-on: ubuntu-latest
    needs: [build-packages, type-check, lint, test, test-windows, test-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Restore core dist
        uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist

      - name: Build Next.js app
        run: npm run build

      - name: Start server in background
        run: npx next start --port 3000 &

      - name: Wait for server (up to 90s)
        run: |
          echo "Waiting for Next.js server..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 90s"
          exit 1

      - name: Smoke - homepage returns 200
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; exit 1; }

      - name: Smoke - page contains expected content
        run: |
          BODY=$(curl -s http://localhost:3000/)
          echo "$BODY" | grep -qi "agent" || { echo "Expected 'agent' not found in response body"; exit 1; }
          echo "Content check passed"

  # ─── 5a. Build + Smoke test (Windows) ─────────────────────────────────────────
  smoke-windows:
    name: Build + smoke test (Windows)
    runs-on: windows-latest
    needs: [build-packages, type-check, lint, test, test-windows, test-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: npm install --legacy-peer-deps

      - name: Restore core dist
        uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist

      - name: Build Next.js app
        shell: bash
        run: npm run build

      - name: Start server, wait for ready, and run smoke tests
        shell: bash
        run: |
          # Start Next.js server in background.
          # Git Bash on Windows runners supports & for background processes;
          # keeping start + wait + assertions in one step ensures the PID stays alive.
          npx next start --port 3000 &
          SERVER_PID=$!
          echo "Started Next.js server (PID $SERVER_PID)"

          # Poll until ready (up to 90s)
          READY=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -eq 0 ]; then
            echo "Server did not become ready in 90s"
            exit 1
          fi

          # Smoke test 1: homepage returns HTTP 200
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Expected 200, got $STATUS"
            exit 1
          fi

          # Smoke test 2: page body contains expected content marker
          BODY=$(curl -s http://localhost:3000/)
          if ! echo "$BODY" | grep -qi "agent"; then
            echo "Expected 'agent' not found in response body"
            exit 1
          fi

          echo "All smoke tests passed on Windows"
