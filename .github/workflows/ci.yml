name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. Type-check ────────────────────────────────────────────────────────
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run type-check

  # ─── 2. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint

  # ─── 3. Build + Smoke test (same runner, no artifact hand-off) ─────────
  build-and-smoke:
    name: Build + smoke test
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Start server in background
        run: npx next start --port 3000 &
        # next start reads .next/ from the same directory - no artifact needed

      - name: Wait for server (up to 60s)
        run: |
          echo "Waiting for Next.js server..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60s"
          # Print any server output for debugging
          exit 1

      - name: Smoke - homepage returns 200
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; exit 1; }

      - name: Smoke - page contains expected content
        run: |
          BODY=$(curl -s http://localhost:3000/)
          echo "$BODY" | grep -qi "agent" || { echo "Expected 'agent' not found in response body"; exit 1; }
          echo "Content check passed"
