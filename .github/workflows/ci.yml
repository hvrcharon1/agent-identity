name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 0. Build publishable packages ────────────────────────────────────────────────
  build-packages:
    name: Build workspace packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Show installed TypeScript version
        run: |
          echo "=== root tsc ==="
          ./node_modules/.bin/tsc --version 2>/dev/null || echo "no root tsc"
          echo "=== packages/core tsc ==="
          ./packages/core/node_modules/.bin/tsc --version 2>/dev/null || echo "no core tsc"
          echo "=== packages/core package.json ==="
          cat packages/core/package.json

      - name: Build @datacules/agent-identity (core) - ESM
        run: |
          cd packages/core
          echo "--- tsconfig.build.json ---"
          cat tsconfig.build.json
          echo "--- tsc -p tsconfig.build.json ---"
          npx tsc -p tsconfig.build.json 2>&1
          echo "ESM build exit: $?"

      - name: Build @datacules/agent-identity (core) - CJS
        run: |
          cd packages/core
          echo "--- tsconfig.cjs.json ---"
          cat tsconfig.cjs.json
          echo "--- tsc -p tsconfig.cjs.json ---"
          npx tsc -p tsconfig.cjs.json 2>&1
          echo "CJS build exit: $?"

      - name: Upload packages/core/dist
        uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
          retention-days: 1

  # ─── 1. Type-check ────────────────────────────────────────────────────────
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    needs: [build-packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - run: npm run type-check

  # ─── 2. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: [build-packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - run: npm run lint

  # ─── 3. Unit tests ────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm test

  # ─── 4. Build + Smoke test ────────────────────────────────────────────────
  build-and-smoke:
    name: Build + smoke test
    runs-on: ubuntu-latest
    needs: [build-packages, type-check, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Restore core dist
        uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist

      - name: Build Next.js app
        run: npm run build

      - name: Start server in background
        run: npx next start --port 3000 &

      - name: Wait for server (up to 90s)
        run: |
          echo "Waiting for Next.js server..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 90s"
          exit 1

      - name: Smoke - homepage returns 200
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; exit 1; }

      - name: Smoke - page contains expected content
        run: |
          BODY=$(curl -s http://localhost:3000/)
          echo "$BODY" | grep -qi "agent" || { echo "Expected 'agent' not found in response body"; exit 1; }
          echo "Content check passed"
