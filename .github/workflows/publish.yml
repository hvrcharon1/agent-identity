name: Publish

# Fires on version tags: v1.0.0, v0.3.2, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ─── Publish all @datacules/* npm packages ────────────────────────────────────────────
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Stamp version on all publishable packages
        run: |
          VERSION=${{ steps.tag.outputs.VERSION }}
          for pkg_json in \
            packages/core/package.json \
            packages/audit/package.json \
            packages/stores/aws/package.json \
            packages/stores/vault/package.json \
            packages/stores/azure/package.json \
            packages/stores/dynamic/package.json \
            packages/stores/spiffe/package.json \
            packages/integrations/express/package.json \
            packages/integrations/fastify/package.json \
            packages/integrations/langchain/package.json \
            packages/integrations/nestjs/package.json \
            packages/integrations/mcp/package.json \
            packages/integrations/mcp-client/package.json \
            packages/integrations/otel/package.json \
            packages/integrations/anomaly/package.json \
            packages/integrations/compliance/package.json; do
            if [ -f "$pkg_json" ]; then
              node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('$pkg_json', 'utf8'));
                if (!p.private) { p.version = '$VERSION'; fs.writeFileSync('$pkg_json', JSON.stringify(p, null, 2) + '\n'); }
              "
            fi
          done

      - name: Build @datacules/agent-identity (core) — ESM
        run: cd packages/core && npx tsc -p tsconfig.build.json

      - name: Build @datacules/agent-identity (core) — CJS
        run: cd packages/core && npx tsc -p tsconfig.cjs.json

      # publish_pkg: truly idempotent npm publish helper.
      # Runs npm publish and inspects stderr for the canonical "already published"
      # signals (E403 + "You cannot publish", E409). Any other non-zero exit still
      # fails the step. This is more robust than `npm view` which can return
      # non-zero for auth/network reasons unrelated to whether the version exists.
      - name: Publish @datacules/agent-identity
        run: |
          set +e
          OUT=$(npm publish --access public 2>&1)
          STATUS=$?
          echo "$OUT"
          if echo "$OUT" | grep -qiE '(cannot publish over|E409|already exists|previously published)'; then
            echo "SKIP: version already published — treating as success"
            exit 0
          fi
          exit $STATUS
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

