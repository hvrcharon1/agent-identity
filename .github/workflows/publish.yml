name: Publish

# Fires on version tags: v1.0.0, v0.3.2, etc.
# Does NOT fire on pre-release suffixes like v1.0.0-beta.1
# (add a separate job or modify the filter below if you need pre-releases)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ─── Publish all @datacules/* npm packages ────────────────────────────────────────
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: tag
        # tag ref looks like refs/tags/v1.2.3 — strip the leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Stamp version on all publishable packages
        # Writes the tag version into every workspace package.json that is
        # not private. Keeps all packages in lock-step without a manual bump.
        run: |
          VERSION=${{ steps.tag.outputs.VERSION }}
          for pkg_json in \
            packages/core/package.json \
            packages/audit/package.json \
            packages/stores/aws/package.json \
            packages/stores/vault/package.json \
            packages/stores/azure/package.json \
            packages/integrations/express/package.json \
            packages/integrations/fastify/package.json \
            packages/integrations/langchain/package.json \
            packages/integrations/nestjs/package.json; do
            if [ -f "$pkg_json" ]; then
              node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('$pkg_json', 'utf8'));
                if (!p.private) { p.version = '$VERSION'; fs.writeFileSync('$pkg_json', JSON.stringify(p, null, 2) + '\\n'); }
              "
            fi
          done

      - name: Build @datacules/agent-identity (core) — ESM
        run: cd packages/core && npx tsc -p tsconfig.build.json

      - name: Build @datacules/agent-identity (core) — CJS
        run: cd packages/core && npx tsc -p tsconfig.cjs.json

      - name: Publish @datacules/agent-identity
        run: npm publish --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-audit
        run: npm publish --access public --provenance
        working-directory: packages/audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-store-aws
        run: npm publish --access public --provenance
        working-directory: packages/stores/aws
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-store-vault
        run: npm publish --access public --provenance
        working-directory: packages/stores/vault
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-store-azure
        run: npm publish --access public --provenance
        working-directory: packages/stores/azure
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-express
        run: npm publish --access public --provenance
        working-directory: packages/integrations/express
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-fastify
        run: npm publish --access public --provenance
        working-directory: packages/integrations/fastify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-langchain
        run: npm publish --access public --provenance
        working-directory: packages/integrations/langchain
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-nestjs
        run: npm publish --access public --provenance
        working-directory: packages/integrations/nestjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── Publish Python SDK to PyPI ───────────────────────────────────────────────
  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version in pyproject.toml
        working-directory: packages/python-sdk
        run: |
          VERSION=${{ steps.tag.outputs.VERSION }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        working-directory: packages/python-sdk
        run: python -m build

      - name: Publish to PyPI
        # Uses PyPI trusted publishing (OIDC) — no API token secret needed.
        # Requires a PyPI publisher configured at:
        # https://pypi.org/manage/project/agent-identity/settings/publishing/
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/

  # ─── Create GitHub Release with auto-generated notes ───────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-python]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for --generate-notes to find the previous tag

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
