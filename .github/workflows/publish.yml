name: Publish

# Fires on version tags: v1.0.0, v0.3.2, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # ─── Publish all @datacules/* npm packages ────────────────────────────────────────────
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Stamp version on all publishable packages
        run: |
          VERSION=${{ steps.tag.outputs.VERSION }}
          for pkg_json in \
            packages/core/package.json \
            packages/audit/package.json \
            packages/stores/aws/package.json \
            packages/stores/vault/package.json \
            packages/stores/azure/package.json \
            packages/stores/dynamic/package.json \
            packages/stores/spiffe/package.json \
            packages/stores/authmd/package.json \
            packages/stores/libsql/package.json \
            packages/integrations/express/package.json \
            packages/integrations/fastify/package.json \
            packages/integrations/langchain/package.json \
            packages/integrations/nestjs/package.json \
            packages/integrations/mcp/package.json \
            packages/integrations/mcp-client/package.json \
            packages/integrations/otel/package.json \
            packages/integrations/anomaly/package.json \
            packages/integrations/compliance/package.json \
            packages/integrations/token-exchange/package.json \
            packages/cli/package.json; do
            if [ -f "$pkg_json" ]; then
              node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('$pkg_json', 'utf8'));
                if (!p.private) {
                  p.version = '$VERSION';
                  for (const section of ['dependencies', 'peerDependencies']) {
                    if (p[section] && p[section]['@datacules/agent-identity'] !== undefined) {
                      p[section]['@datacules/agent-identity'] = '^$VERSION';
                    }
                  }
                  fs.writeFileSync('$pkg_json', JSON.stringify(p, null, 2) + '\n');
                }
              "
            fi
          done

      - name: Copy LICENSE into each package directory
        run: |
          for pkg_dir in \
            packages/core \
            packages/audit \
            packages/stores/aws \
            packages/stores/vault \
            packages/stores/azure \
            packages/stores/dynamic \
            packages/stores/spiffe \
            packages/stores/authmd \
            packages/stores/libsql \
            packages/integrations/express \
            packages/integrations/fastify \
            packages/integrations/langchain \
            packages/integrations/nestjs \
            packages/integrations/mcp \
            packages/integrations/mcp-client \
            packages/integrations/otel \
            packages/integrations/anomaly \
            packages/integrations/compliance \
            packages/integrations/token-exchange \
            packages/cli; do
            if [ -d "$pkg_dir" ]; then
              cp LICENSE "$pkg_dir/LICENSE"
            fi
          done

      # Build core first — all other packages depend on its type declarations
      - name: Build @datacules/agent-identity (core)
        run: npm run build --workspace=packages/core

      # Build all remaining publishable npm packages in dependency-safe order
      - name: Build remaining npm packages
        run: |
          npm run build --workspace=packages/audit
          npm run build --workspace=packages/stores/aws
          npm run build --workspace=packages/stores/vault
          npm run build --workspace=packages/stores/azure
          npm run build --workspace=packages/stores/dynamic
          npm run build --workspace=packages/stores/spiffe
          npm run build --workspace=packages/stores/authmd
          npm run build --workspace=packages/stores/libsql
          npm run build --workspace=packages/integrations/express
          npm run build --workspace=packages/integrations/fastify
          npm run build --workspace=packages/integrations/langchain
          npm run build --workspace=packages/integrations/nestjs
          npm run build --workspace=packages/integrations/mcp
          npm run build --workspace=packages/integrations/mcp-client
          npm run build --workspace=packages/integrations/otel
          npm run build --workspace=packages/integrations/anomaly
          npm run build --workspace=packages/integrations/compliance
          npm run build --workspace=packages/integrations/token-exchange
          npm run build --workspace=packages/cli

      # Idempotent publish: run npm publish and treat E409/already-exists as success.
      - name: Publish @datacules/agent-identity
        run: |
          set +e
          OUT=$(npm publish --access public 2>&1)
          STATUS=$?
          echo "$OUT"
          if echo "$OUT" | grep -qiE '(cannot publish over|E409|already exists|previously published)'; then
            echo "SKIP: version already published — treating as success"
            exit 0
          fi
          exit $STATUS
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @datacules/agent-identity-audit
        run: |
          set +e
          OUT=$(npm publish --access public 2>&1)
          STATUS=$?
          echo "$OUT"
          if echo "$OUT" | grep -qiE '(cannot publish over|E409|already exists|previously published)'; then
