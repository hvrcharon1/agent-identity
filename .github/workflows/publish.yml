  # ─── Publish Python SDK to PyPI ─────────────────────────────────────────────────────
  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version in pyproject.toml
        working-directory: packages/python-sdk
        run: |
          VERSION=${{ steps.tag.outputs.VERSION }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        working-directory: packages/python-sdk
        run: python -m build

      # OIDC trusted publishing — no PYPI_TOKEN secret required.
      # One-time setup: go to pypi.org → datacules-agent-identity → Manage →
      # Publishing → Add trusted publisher:
      #   owner: hvrcharon1   repo: agent-identity   workflow: publish.yml
      #
      # Falls back to password token if PYPI_TOKEN secret is set (e.g. before
      # OIDC is configured). skip_existing ensures idempotency on re-runs.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          skip-existing: true

  # ─── Create GitHub Release with auto-generated notes ──────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-python]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
