  # ─── Publish Python SDK to PyPI ──────────────────────────────────────────────────
  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version in pyproject.toml
        working-directory: packages/python-sdk
        run: |
          VERSION=${{ steps.tag.outputs.VERSION }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Install build + upload tools
        run: pip install build twine

      - name: Build sdist + wheel
        working-directory: packages/python-sdk
        run: python -m build

      # twine upload with API token.
      # PYPI_TOKEN must be set in repo secrets (Settings → Secrets → Actions).
      # To create a token: pypi.org → Account Settings → API tokens →
      # Add API token → scope to "datacules-agent-identity" project.
      # --skip-existing makes re-runs idempotent (already-uploaded wheel = success).
      - name: Publish to PyPI
        working-directory: packages/python-sdk
        run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ─── Create GitHub Release with auto-generated notes ──────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-python]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
